<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockComet Chat</title>
<!-- Ready-made client SDK, nothing hand-rolled for the networking itself -->
<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.3/dist/pocketbase.umd.js"></script>
<style>
  :root{color-scheme:light dark;--bg:#fff;--fg:#101828;--muted:#667085;--line:#e4e7ec;--accent:#1E88E5;--bubble:#EEF3FC;}
  @media (prefers-color-scheme:dark){:root{--bg:#101828;--fg:#f5f8ff;--muted:#9aa5b1;--line:#243043;--bubble:#1b2638;}}
  *{box-sizing:border-box}
  body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
  header{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
  #setup,#auth{padding:16px;display:flex;flex-direction:column;gap:10px;max-width:420px}
  input,button{font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg)}
  button{background:var(--accent);color:#fff;border:none}
  #app{display:none;flex:1;min-height:0;flex-direction:row}
  #friends{width:38%;border-right:1px solid var(--line);overflow-y:auto}
  #friends .row{padding:10px 12px;border-bottom:1px solid var(--line)}
  #friends .row.active{background:var(--bubble)}
  #chatPane{flex:1;display:flex;flex-direction:column;min-width:0}
  #messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:78%;padding:8px 10px;border-radius:12px;background:var(--bubble)}
  .msg.mine{align-self:flex-end;background:var(--accent);color:#fff}
  .invite{border:1px dashed var(--accent);border-radius:10px;padding:8px;margin-top:4px}
  .invite button{margin-top:6px;width:100%}
  #composer{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  #composer input{flex:1}
  .muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>BlockComet Chat
  <span style="float:right;display:flex;gap:10px">
    <span onclick="restoreBackup()" style="cursor:pointer" title="Restore from backup file">📂</span>
    <span onclick="downloadBackup()" style="cursor:pointer" title="Save a backup file (friends + messages)">💾</span>
    <span onclick="toggleSetup()" style="cursor:pointer" title="Change server">⚙️</span>
  </span>
</header>
<input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="doRestore(this.files[0])">

<div id="setup" style="display:none">
  <div class="muted">Only needed if you want your own server instead of the built-in one (see docs/CHAT.md).</div>
  <input id="serverUrl" placeholder="https://your-server.example.com">
  <button onclick="saveServerUrl()">Save &amp; continue</button>
</div>

<div id="auth" style="display:none">
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Log in</button>
  <button onclick="register()" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">Create account</button>
  <div id="authError" class="muted"></div>
</div>

<div id="app">
  <div id="friends">
    <div style="padding:10px;display:flex;gap:6px">
      <input id="addFriend" placeholder="Add by username">
      <button onclick="addFriend()">Add</button>
    </div>
    <div id="friendList"></div>
  </div>
  <div id="chatPane">
    <div id="messages"></div>
    <div id="composer">
      <input id="msgInput" placeholder="Message">
      <button onclick="sendInviteDialog()" title="Send a join-server invite">🎮</button>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
let pb, me, activeFriend = null;

function saveServerUrl(){
  const url = document.getElementById('serverUrl').value.trim();
  if(!url) return;
  if(window.AndroidChat) AndroidChat.setServerUrl(url);
  initPb(url);
  document.getElementById('setup').style.display = 'none';
  document.getElementById('auth').style.display = 'flex';
}

function initPb(url){
  pb = new PocketBase(url);
}

async function login(){
  try{
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const res = await pb.collection('users').authWithPassword(u, p);
    me = res.record;
    enterApp();
  }catch(e){ document.getElementById('authError').textContent = 'Login failed: ' + e.message; }
}

async function register(){
  try{
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    await pb.collection('users').create({ username:u, email:u+'@blockcomet.local', password:p, passwordConfirm:p, emailVisibility:false });
    await login();
  }catch(e){ document.getElementById('authError').textContent = 'Could not create account: ' + e.message; }
}

function enterApp(){
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadFriends();
}

async function addFriend(){
  const uname = document.getElementById('addFriend').value.trim();
  if(!uname) return;
  const target = await pb.collection('users').getFirstListItem('username="'+uname+'"').catch(()=>null);
  if(!target){ alert('No such user'); return; }
  await pb.collection('friends').create({ requester: me.id, addressee: target.id, status: 'accepted' });
  document.getElementById('addFriend').value = '';
  loadFriends();
}

async function loadFriends(){
  const list = await pb.collection('friends').getFullList({ filter: `requester="${me.id}" || addressee="${me.id}"`, expand: 'requester,addressee' });
  const box = document.getElementById('friendList');
  box.innerHTML = '';
  for(const f of list){
    const other = f.requester === me.id ? f.expand.addressee : f.expand.requester;
    if(!other) continue;
    const row = document.createElement('div');
    row.className = 'row';
    row.textContent = other.username;
    row.onclick = () => openChat(other);
    box.appendChild(row);
  }
}

async function openChat(friend){
  activeFriend = friend;
  await loadMessages();
  pb.collection('messages').unsubscribe();
  pb.collection('messages').subscribe('*', (e) => {
    if(!activeFriend) return;
    if(e.record.from === activeFriend.id || e.record.to === activeFriend.id) renderMessage(e.record);
  });
}

async function loadMessages(){
  const box = document.getElementById('messages');
  box.innerHTML = '';
  const list = await pb.collection('messages').getFullList({
    filter: `(from="${me.id}" && to="${activeFriend.id}") || (from="${activeFriend.id}" && to="${me.id}")`,
    sort: 'created'
  });
  for(const m of list) renderMessage(m);
}

function renderMessage(m){
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg' + (m.from === me.id ? ' mine' : '');
  if(m.type === 'invite'){
    div.innerHTML = (m.body||'Join my server') + '<div class="invite">' + m.invite_host + (m.invite_port? ':'+m.invite_port:'') +
      '<button onclick="joinInvite(\''+m.invite_host+'\',\''+(m.invite_port||'')+'\')">Join</button></div>';
  } else {
    div.textContent = m.body;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function joinInvite(host, port){
  if(window.AndroidChat) AndroidChat.onServerInvite(host, port);
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  if(!body || !activeFriend) return;
  await pb.collection('messages').create({ from: me.id, to: activeFriend.id, body, type: 'text' });
  input.value = '';
}

function sendInviteDialog(){
  if(!activeFriend) return;
  const host = prompt('Server address (IP or domain):');
  if(!host) return;
  const port = prompt('Port (leave empty for default 25565):') || '';
  pb.collection('messages').create({ from: me.id, to: activeFriend.id, body: 'Join my server', type: 'invite', invite_host: host, invite_port: port });
}

// ---- Backup / restore -------------------------------------------------------------------------------------
// Keeps your friends + messages safe in a local file, in case the server ever gets reset or deleted.
async function downloadBackup(){
  if(!me){ alert('Log in first.'); return; }
  const friends = await pb.collection('friends').getFullList({ filter: `requester="${me.id}" || addressee="${me.id}"`, expand: 'requester,addressee' });
  const messages = await pb.collection('messages').getFullList({ filter: `from="${me.id}" || to="${me.id}"`, sort: 'created' });
  const backup = {
    version: 1,
    exported_at: new Date().toISOString(),
    me: { username: me.username },
    friends: friends.map(f => ({
      me_role: f.requester === me.id ? 'requester' : 'addressee',
      other_username: (f.requester === me.id ? f.expand.addressee : f.expand.requester)?.username,
      status: f.status
    })),
    messages: messages.map(m => ({
      direction: m.from === me.id ? 'sent' : 'received',
      other_username: null, // filled in below
      from_id: m.from, to_id: m.to,
      body: m.body, type: m.type, invite_host: m.invite_host, invite_port: m.invite_port,
      created: m.created
    }))
  };
  // resolve the "other" username for each message from the friends list we already fetched
  const idToName = {};
  for(const f of friends){
    if(f.expand.requester) idToName[f.expand.requester.id] = f.expand.requester.username;
    if(f.expand.addressee) idToName[f.expand.addressee.id] = f.expand.addressee.username;
  }
  backup.messages.forEach(m => { m.other_username = idToName[m.direction === 'sent' ? m.to_id : m.from_id] || null; delete m.from_id; delete m.to_id; });

  const filename = 'blockcomet-chat-backup-' + me.username + '-' + new Date().toISOString().slice(0,10) + '.json';
  const json = JSON.stringify(backup, null, 2);
  if(window.AndroidChat && AndroidChat.saveBackupFile){
    AndroidChat.saveBackupFile(filename, json); // saved to the device's Downloads folder
  } else {
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }
}

function restoreBackup(){
  if(window.AndroidChat && AndroidChat.pickBackupFile){
    AndroidChat.pickBackupFile(); // opens the system picker; result comes back via window.onBackupFilePicked
  } else {
    document.getElementById('restoreFile').click();
  }
}

// Android calls this once the user picks a file in the system file picker
window.onBackupFilePicked = function(jsonText){
  doRestore(null, jsonText);
};

async function doRestore(file, jsonTextFromAndroid){
  if(!me){ alert('Log in first.'); return; }
  const data = JSON.parse(jsonTextFromAndroid !== undefined ? jsonTextFromAndroid : await file.text());
  if(data.version !== 1){ alert('Unrecognized backup file.'); return; }
  let restoredFriends = 0, restoredMessages = 0, skipped = [];
  for(const f of data.friends || []){
    const target = await pb.collection('users').getFirstListItem('username="'+f.other_username+'"').catch(()=>null);
    if(!target){ skipped.push(f.other_username); continue; }
    const exists = await pb.collection('friends').getFirstListItem(
      `(requester="${me.id}" && addressee="${target.id}") || (requester="${target.id}" && addressee="${me.id}")`
    ).catch(()=>null);
    if(!exists){
      await pb.collection('friends').create({ requester: me.id, addressee: target.id, status: f.status || 'accepted' });
      restoredFriends++;
    }
  }
  for(const m of data.messages || []){
    const other = await pb.collection('users').getFirstListItem('username="'+m.other_username+'"').catch(()=>null);
    if(!other) continue;
    const from = m.direction === 'sent' ? me.id : other.id;
    const to = m.direction === 'sent' ? other.id : me.id;
    await pb.collection('messages').create({ from, to, body: m.body, type: m.type, invite_host: m.invite_host, invite_port: m.invite_port });
    restoredMessages++;
  }
  alert(`Restored ${restoredFriends} friend(s) and ${restoredMessages} message(s).` +
        (skipped.length ? `\nSkipped (not registered on this server yet): ${skipped.join(', ')}` : ''));
  loadFriends();
}

function toggleSetup(){
  const el = document.getElementById('setup');
  el.style.display = el.style.display === 'none' ? 'flex' : 'none';
}

// On load: the launcher always has a server URL (built-in default, or one the user saved before) -- go straight to login
(function(){
  const url = window.AndroidChat ? AndroidChat.getServerUrl() : '';
  document.getElementById('serverUrl').value = url;
  if(url){
    initPb(url);
    document.getElementById('auth').style.display = 'flex';
  } else {
    // only reachable outside the app (plain browser preview), where there's no built-in default
    document.getElementById('setup').style.display = 'flex';
  }
})();
</script>
</body>
</html>
